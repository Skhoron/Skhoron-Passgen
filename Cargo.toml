[package]
name = "skhoron-passgen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Password generator with rejection sampling + Argon2id hashing/verification"
repository = "https://github.com/Skhoron/skhoron-passgen"

[dependencies]
rand = "0.8"
argon2 = "0.5"
password-hash = "0.5"
zeroize = "1.7"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true